#.github/workflows/daily_build.yml (Branch Push Model - FINAL)

name: Daily Cyber Calendar Build and Deploy

# Triggers the workflow on schedule, manually, and upon push to main
on:
  schedule:
    - cron: '5 0 * * *' 
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  generate_and_deploy:
    runs-on: ubuntu-latest
    
    # CRITICAL FIX: Explicitly grant permissions to the GITHUB_TOKEN
    # This is required for the push to be authenticated correctly.
    permissions:
      contents: write # Allows the action to push files to the gh-pages branch [1]
      pages: write    # Ensures compliance for deployment actions [2]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. Run the Node.js script to generate index.html in./public
      # (This step includes the logic to read src/template.html and data/tips.json)
      - name: Generate Static Calendar Files
        run: node src/generate.js

      # 2. Deploy the generated static files to the gh-pages branch
      # This replaces all the manual git commands (switch, reset, commit, push)
      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          # Use the GITHUB_TOKEN provided by the runner [3]
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Path to the files generated by generate.js
          publish_dir: ./public 
          # Target the specific branch monitored by your Pages settings
          publish_branch: gh-pages
          # Ensures only the latest files are on the gh-pages branch
          force_orphan: true